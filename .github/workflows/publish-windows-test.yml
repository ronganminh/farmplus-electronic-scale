name: Verify and publish FarmPlus Windows test release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag containing staged ZIP
        type: string
        required: true
        default: v2.0.0-test

permissions:
  contents: write

concurrency:
  group: farmplus-test-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUNDLE_NAME: FarmPlus_Manual_v2_PUBLIC_TEST.zip
      EXPECTED_EXE_SHA256: 8859ee18f9f1bdebd14ef38b1843bc0c57d5ca062611d3aa28e796b5fcf640ba
    steps:
      - name: Checkout validation code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and run independent formatting tests
        shell: pwsh
        run: |
          dotnet build src/ScaleInput/ScaleInput.csproj -c Release
          dotnet run --project tests/ScaleInput.SmokeTests/ScaleInput.SmokeTests.csproj -c Release

      - name: Download staged bundle from draft release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "$env:BUNDLE_NAME" --dir staging
          if ($LASTEXITCODE -ne 0) { throw "Draft release bundle unavailable" }

      - name: Validate archive, executable and installer without hardware
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $bundle = Join-Path 'staging' $env:BUNDLE_NAME
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw 'ZIP bundle was not found' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $bundle).Path)
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            $mustHave = @(
              'FarmPlus_Manual_v2/App/Chuongtrinhcan.exe',
              'FarmPlus_Manual_v2/App/Chuongtrinhcan.exe.config',
              'FarmPlus_Manual_v2/CAI_DAT_FARMPLUS_V2.bat',
              'FarmPlus_Manual_v2/install_farmplus_v2.ps1',
              'FarmPlus_Manual_v2/PHUC_HOI_EXE_CU.bat',
              'FarmPlus_Manual_v2/restore_previous_exe.ps1'
            )
            foreach ($item in $mustHave) {
              if ($names -cnotcontains $item) { throw "Missing required file: $item" }
            }
            foreach ($name in $names) {
              if ($name -match '(^|/)\.\.(/|$)' -or $name.StartsWith('/')) { throw "Unsafe archive path: $name" }
              if ($name -match '(?i)\.(mdb|accdb|ldb|ttf|otf|pfx|key)$') { throw "Sensitive/restricted file in public ZIP: $name" }
            }
            Write-Host "Validated $($names.Count) ZIP entries; no database/font/credential extensions detected"
          } finally { $archive.Dispose() }
          $temp = Join-Path $env:RUNNER_TEMP 'farmplus-v2-test'
          Expand-Archive -LiteralPath $bundle -DestinationPath $temp -Force
          $exe = Join-Path $temp 'FarmPlus_Manual_v2/App/Chuongtrinhcan.exe'
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:EXPECTED_EXE_SHA256) { throw "EXE SHA mismatch: $sha" }
          $assembly = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $exe).Path)
          Write-Host "Managed executable: $($assembly.FullName)"
          $ps1 = Join-Path $temp 'FarmPlus_Manual_v2/install_farmplus_v2.ps1'
          $null = $tokens = $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($ps1, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Installer PowerShell parse errors: $($parseErrors -join ', ')" }
          $installer = Get-Content -LiteralPath $ps1 -Raw
          if (-not $installer.Contains($env:EXPECTED_EXE_SHA256)) { throw 'Installer missing expected EXE checksum' }
          if (-not $installer.Contains('sys\data.mdb')) { throw 'Installer does not check existing database' }
          Write-Host "PASS: archive, EXE hash, .NET metadata and PowerShell installer parser"

      - name: Re-upload verified bundle into Release using GitHub Actions
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" "staging/$env:BUNDLE_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

      - name: Publish verified test release
        shell: pwsh
        run: |
          gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          Write-Host "RELEASE PASS: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
