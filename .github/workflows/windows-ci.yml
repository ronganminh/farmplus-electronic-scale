name: Windows format checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formatting:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build formatter
        run: dotnet build src/ScaleInput/ScaleInput.csproj -c Release
      - name: Smoke tests (standalone formatter only)
        run: dotnet run --project tests/ScaleInput.SmokeTests/ScaleInput.SmokeTests.csproj -c Release
